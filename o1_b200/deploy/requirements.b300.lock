# Complete frozen environment for the B300/cu130 production container.
# Installed EXCLUSIVELY from the local frozen wheel set (--no-index
# --find-links=/wheels; hashes in WHEELS_B300.sha256, recorded in
# CONTAINER_IMAGE_RECORD.json). No network resolution at build or runtime.
#
# Migration provenance: replaces the cu128 stack (torch 2.12.0.dev20260408
# +cu128, monolithic wheel). torch 2.12.1+cu130 is the current stable
# official build on the same 2.12 line; sm_103 (B300) executes the wheel's
# sm_100 cubins natively (NVIDIA same-major/higher-minor SASS rule) plus 59
# sm_103a arch-tuned kernels; sm_100 (B200 fallback) and sm_120 (local
# verification GPU) are compiled targets. No PTX is embedded: JIT fallback
# is structurally impossible. Scientific pins unchanged:
# transformers==4.54.1 exact, numpy==2.4.4, BF16 eager only.
